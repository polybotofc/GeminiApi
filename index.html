<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hikaru REST API — Console</title>
<meta name="description" content="Konsol referensi Hikaru REST API. Jelajahi endpoint, baca dokumentasi, dan uji langsung dari browser." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<style>
/* ==========================================================
   HIKARU REST API — CONSOLE — design tokens
   Palette   : blueprint paper (#EEF2F5) + navy ink (#17222E)
               + signal teal (#0F9D9D) + amber (#E08A2E)
   Type      : IBM Plex Mono (display/labels) + IBM Plex Sans (body)
   Signature : left "bus line" wiring the endpoint tree together,
               and a live oscilloscope trace that fires on request
   ========================================================== */
:root{
  --paper:#EEF2F5; --paper2:#E4EAEF; --card:#FFFFFF;
  --ink:#17222E; --ink-dim:#52616F; --ink-faint:#8B98A4;
  --line:#C9D3DA; --line-strong:#AEBAC3;
  --teal:#0F9D9D; --teal-dim:#0F9D9D22;
  --amber:#DB8B2E; --amber-dim:#DB8B2E1f;
  --red:#D64545; --red-dim:#D645451c;
  --mono:'IBM Plex Mono',monospace; --sans:'IBM Plex Sans',sans-serif;
  --radius:10px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{
  font-family:var(--sans); background:var(--paper); color:var(--ink);
  min-height:100vh;
  background-image:
    linear-gradient(var(--paper2) 1px, transparent 1px),
    linear-gradient(90deg, var(--paper2) 1px, transparent 1px);
  background-size:28px 28px;
}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;}
input{font-family:inherit;}
code,pre{font-family:var(--mono);}

/* ---------- topbar ---------- */
.topbar{
  position:sticky; top:0; z-index:100;
  display:flex; align-items:center; gap:20px;
  padding:14px 24px; background:rgba(238,242,245,0.92);
  backdrop-filter:blur(10px); border-bottom:1px solid var(--line);
}
.brand{display:flex; align-items:center; gap:10px; font-family:var(--mono); font-weight:700; font-size:1.02rem; letter-spacing:.01em; flex-shrink:0;}
.brand .dot{width:9px;height:9px;border-radius:2px;background:var(--teal); box-shadow:0 0 0 3px var(--teal-dim); animation:blink 2.4s ease-in-out infinite;}
@keyframes blink{0%,100%{opacity:1} 50%{opacity:.35}}
.brand small{font-family:var(--sans); font-weight:500; color:var(--ink-dim); font-size:.72rem; letter-spacing:.06em; text-transform:uppercase;}
.topbar-search{
  flex:1; max-width:420px; display:flex; align-items:center; gap:8px;
  background:var(--card); border:1px solid var(--line); border-radius:8px; padding:8px 12px;
  font-family:var(--mono); font-size:.82rem; color:var(--ink-dim);
}
.topbar-search input{flex:1; background:none; border:none; color:var(--ink); font-size:.82rem;}
.topbar-search input::placeholder{color:var(--ink-faint);}
.topbar-search kbd{font-size:.68rem; padding:1px 6px; border:1px solid var(--line); border-radius:4px; color:var(--ink-faint);}
.topbar-links{display:flex; align-items:center; gap:4px; margin-left:auto;}
.topbar-link{padding:7px 12px; font-size:.82rem; font-weight:600; color:var(--ink-dim); border-radius:7px; transition:.2s;}
.topbar-link:hover{background:var(--card); color:var(--ink);}
.status-chip{display:flex; align-items:center; gap:6px; padding:6px 12px; border-radius:20px; background:var(--teal-dim); border:1px solid var(--teal); font-family:var(--mono); font-size:.72rem; color:var(--teal); font-weight:600;}
.status-chip .pd{width:6px;height:6px;border-radius:50%;background:var(--teal); box-shadow:0 0 6px var(--teal); animation:blink 1.8s infinite;}

/* ---------- layout ---------- */
.layout{display:grid; grid-template-columns:260px 1fr; min-height:calc(100vh - 57px); transition:grid-template-columns .25s ease;}
.layout.collapsed{grid-template-columns:0px 1fr;}

/* ---------- sidebar / endpoint tree ---------- */
.sidebar{
  border-right:1px solid var(--line); padding:24px 0 40px;
  position:relative; overflow-y:auto; overflow-x:hidden;
  min-width:260px; transition:min-width .25s ease, opacity .2s ease;
}
.layout.collapsed .sidebar{min-width:0; width:0; padding:24px 0 40px; opacity:0; pointer-events:none;}
.collapse-btn{
  display:flex; align-items:center; justify-content:center; width:26px; height:26px; border-radius:7px;
  background:var(--card); border:1px solid var(--line-strong); color:var(--ink-dim); flex-shrink:0; transition:.15s;
}
.collapse-btn:hover{color:var(--ink); border-color:var(--teal);}
.collapse-btn.rotated i{transform:rotate(180deg);}
.collapse-btn i{transition:.2s;}
.sidebar::before{
  content:''; position:absolute; top:0; bottom:0; left:24px; width:1px;
  background:repeating-linear-gradient(to bottom, var(--line-strong) 0 4px, transparent 4px 8px);
}
.sidebar-group{margin-bottom:6px;}
.sidebar-group-label{
  font-family:var(--mono); font-size:.68rem; letter-spacing:.12em; text-transform:uppercase;
  color:var(--ink-faint); padding:10px 24px 8px 40px; font-weight:600;
}
.node{
  position:relative; display:flex; align-items:center; gap:10px;
  padding:9px 20px 9px 40px; cursor:pointer; transition:.15s;
  border-left:2px solid transparent;
}
.node::before{
  content:''; position:absolute; left:24px; top:50%; width:14px; height:1px; background:var(--line-strong);
}
.node:hover{background:var(--card);}
.node.active{background:var(--card); border-left-color:var(--teal);}
.node.active .node-name{color:var(--ink); font-weight:700;}
.node-method{
  font-family:var(--mono); font-size:.62rem; font-weight:700; padding:2px 6px; border-radius:4px;
  flex-shrink:0; min-width:34px; text-align:center;
}
.node-method.get{background:var(--teal-dim); color:var(--teal);}
.node-method.post{background:var(--amber-dim); color:var(--amber);}
.node-name{font-size:.83rem; color:var(--ink-dim); font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.node-pulse{width:5px;height:5px;border-radius:50%;background:var(--teal); margin-left:auto; flex-shrink:0; box-shadow:0 0 5px var(--teal);}

/* ---------- main ---------- */
.main{padding:32px 36px 80px; max-width:1180px;}
.crumb{font-family:var(--mono); font-size:.72rem; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.08em; margin-bottom:8px;}
.crumb span{color:var(--teal);}
.title-row{display:flex; align-items:center; gap:14px; margin-bottom:6px; flex-wrap:wrap;}
.page-title{font-family:var(--mono); font-size:1.9rem; font-weight:700; letter-spacing:-.01em;}
.tag-live{display:flex; align-items:center; gap:6px; font-family:var(--mono); font-size:.68rem; font-weight:700; color:var(--teal); background:var(--teal-dim); border:1px solid var(--teal); padding:3px 10px; border-radius:20px; text-transform:uppercase;}
.page-desc{color:var(--ink-dim); font-size:.95rem; max-width:640px; margin-bottom:28px; line-height:1.65;}

.split{display:grid; grid-template-columns:1fr 420px; gap:28px; align-items:start;}

/* ---------- docs column ---------- */
.doc-block{margin-bottom:32px;}
.doc-label{font-family:var(--mono); font-size:.72rem; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:12px; font-weight:600; display:flex; align-items:center; gap:8px;}
.doc-label::after{content:''; flex:1; height:1px; background:var(--line);}

.param-table{width:100%; border-collapse:collapse; font-size:.85rem;}
.param-table th{text-align:left; font-family:var(--mono); font-size:.68rem; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-faint); padding:8px 12px; border-bottom:1px solid var(--line-strong);}
.param-table td{padding:12px; border-bottom:1px solid var(--line); vertical-align:top;}
.param-table code{background:var(--paper2); padding:2px 6px; border-radius:4px; font-size:.8rem; color:var(--teal); font-weight:600;}
.param-req{font-family:var(--mono); font-size:.65rem; font-weight:700; color:var(--red);}
.param-opt{font-family:var(--mono); font-size:.65rem; color:var(--ink-faint);}
.param-desc{color:var(--ink-dim); font-size:.83rem;}

.snippet-tabs{display:flex; gap:2px; margin-bottom:0; border-bottom:1px solid var(--line-strong);}
.snippet-tab{padding:9px 16px; font-family:var(--mono); font-size:.76rem; font-weight:600; color:var(--ink-faint); border-bottom:2px solid transparent; transition:.15s;}
.snippet-tab:hover{color:var(--ink-dim);}
.snippet-tab.active{color:var(--teal); border-bottom-color:var(--teal);}
.snippet-body{position:relative; background:var(--ink); border-radius:0 0 var(--radius) var(--radius); overflow:hidden;}
.snippet-pane{display:none; padding:20px; font-size:.8rem; line-height:1.75; color:#D6DEE5; overflow-x:auto;}
.snippet-pane.active{display:block;}
.snippet-copy{position:absolute; top:10px; right:10px; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.14); color:#D6DEE5; font-size:.72rem; padding:5px 10px; border-radius:6px; display:flex; align-items:center; gap:6px; transition:.15s;}
.snippet-copy:hover{background:rgba(255,255,255,.16);}
.sk{color:#7FB3E8;} .sf{color:#8FD5C0;} .ss{color:#E3C078;} .sn{color:#E39A7A;} .sc{color:#6B7A87; font-style:italic;}

/* ---------- console column ---------- */
.console{
  background:var(--card); border:1px solid var(--line-strong); border-radius:var(--radius);
  position:sticky; top:80px; overflow:hidden;
}
.console-head{
  display:flex; align-items:center; gap:10px; padding:12px 16px; background:var(--paper2); border-bottom:1px solid var(--line-strong);
}
.console-head .dots{display:flex; gap:5px;}
.console-head .dots span{width:8px;height:8px;border-radius:50%; background:var(--line-strong);}
.console-head-title{font-family:var(--mono); font-size:.74rem; font-weight:600; color:var(--ink-dim); text-transform:uppercase; letter-spacing:.06em;}
.trace{margin-left:auto; width:70px; height:16px;}
.trace path{fill:none; stroke:var(--line-strong); stroke-width:1.4; transition:stroke .3s;}
.trace.live path{stroke:var(--teal);}

.console-url{
  display:flex; align-items:center; gap:8px; padding:12px 16px; font-family:var(--mono); font-size:.72rem;
  color:var(--ink-dim); border-bottom:1px solid var(--line); overflow-x:auto; white-space:nowrap;
}
.method-pill{font-weight:700; padding:2px 8px; border-radius:4px; flex-shrink:0;}
.method-pill.get{background:var(--teal-dim); color:var(--teal);}
.method-pill.post{background:var(--amber-dim); color:var(--amber);}

.console-form{padding:16px; display:flex; flex-direction:column; gap:14px;}
.field{display:flex; flex-direction:column; gap:6px;}
.field label{font-family:var(--mono); font-size:.72rem; color:var(--ink-dim); display:flex; gap:6px; align-items:center;}
.field label .req{color:var(--red); font-size:.65rem;}
.field input{
  background:var(--paper); border:1px solid var(--line-strong); border-radius:7px; padding:10px 12px;
  font-size:.85rem; color:var(--ink); transition:.15s;
}
.field input:focus{outline:none; border-color:var(--teal); box-shadow:0 0 0 3px var(--teal-dim);}
.send-btn{
  display:flex; align-items:center; justify-content:center; gap:8px; padding:11px; border-radius:8px;
  background:var(--ink); color:#fff; font-family:var(--mono); font-weight:700; font-size:.82rem;
  letter-spacing:.02em; transition:.15s; border:none;
}
.send-btn:hover{background:#0d1620;}
.send-btn:disabled{opacity:.6; cursor:progress;}

.console-response{border-top:1px solid var(--line);}
.resp-tabs{display:flex; align-items:center; padding:0 16px; border-bottom:1px solid var(--line); gap:2px;}
.resp-tab{padding:9px 12px; font-family:var(--mono); font-size:.7rem; font-weight:600; color:var(--ink-faint); border-bottom:2px solid transparent;}
.resp-tab.active{color:var(--teal); border-bottom-color:var(--teal);}
.resp-status{margin-left:auto; font-family:var(--mono); font-size:.7rem; font-weight:700; padding:2px 8px; border-radius:4px;}
.resp-status.ok{color:var(--teal); background:var(--teal-dim);}
.resp-status.err{color:var(--red); background:var(--red-dim);}
.resp-body{max-height:340px; overflow:auto; padding:16px; font-family:var(--mono); font-size:.78rem; line-height:1.7; background:var(--ink); color:#D6DEE5;}
.resp-placeholder{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; padding:36px 16px; color:var(--ink-faint); font-size:.8rem; text-align:center;}
.resp-placeholder i{font-size:1.4rem; opacity:.5;}
.tt-card{display:flex; flex-direction:column; gap:10px;}
.tt-thumb{width:100%; border-radius:8px; max-height:180px; object-fit:cover; border:1px solid rgba(255,255,255,.1);}
.tt-title{font-family:var(--sans); font-size:.82rem; color:#EAF0F4; line-height:1.5;}
.tt-author{font-size:.74rem; color:#8FA3B0;}
.tt-links{display:flex; flex-direction:column; gap:7px; margin-top:4px;}
.tt-link{display:flex; align-items:center; justify-content:center; gap:8px; padding:9px; border-radius:7px; font-family:var(--sans); font-size:.78rem; font-weight:600; background:var(--teal); color:#08201F;}
.tt-link:hover{filter:brightness(1.08);}

/* ---------- config view ---------- */
.cfg-block{background:var(--card); border:1px solid var(--line-strong); border-radius:var(--radius); padding:22px 24px; margin-bottom:24px; max-width:720px;}
.cfg-block h3{font-family:var(--mono); font-size:.92rem; margin-bottom:4px;}
.cfg-block .cfg-sub{color:var(--ink-dim); font-size:.82rem; margin-bottom:16px; line-height:1.6;}
.cfg-row{display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap;}
.cfg-field{display:flex; flex-direction:column; gap:6px; flex:1; min-width:160px;}
.cfg-field label{font-family:var(--mono); font-size:.7rem; color:var(--ink-dim); text-transform:uppercase; letter-spacing:.06em;}
.cfg-field input, .cfg-field select, .cfg-field textarea{
  background:var(--paper); border:1px solid var(--line-strong); border-radius:7px; padding:9px 11px; font-size:.85rem; color:var(--ink); font-family:var(--sans);
}
.cfg-field textarea{font-family:var(--mono); font-size:.78rem; resize:vertical; min-height:60px;}
.cfg-field input:focus, .cfg-field select:focus, .cfg-field textarea:focus{outline:none; border-color:var(--teal); box-shadow:0 0 0 3px var(--teal-dim);}
.cfg-btn{padding:10px 16px; border-radius:7px; font-family:var(--mono); font-size:.78rem; font-weight:700; border:none; flex-shrink:0;}
.cfg-btn.primary{background:var(--ink); color:#fff;}
.cfg-btn.primary:hover{background:#0d1620;}
.cfg-btn.ghost{background:var(--paper); border:1px solid var(--line-strong); color:var(--ink-dim);}
.cfg-btn.ghost:hover{color:var(--ink); border-color:var(--ink-faint);}
.cfg-btn.danger{background:var(--red-dim); color:var(--red); border:1px solid var(--red);}
.cfg-list{display:flex; flex-direction:column; gap:8px;}
.cfg-list-item{display:flex; align-items:center; gap:12px; padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:var(--paper);}
.cfg-list-item .node-method{flex-shrink:0;}
.cfg-list-item .clabel{flex:1; font-size:.85rem; font-weight:600;}
.cfg-list-item .cpath{font-family:var(--mono); font-size:.75rem; color:var(--ink-faint);}
.cfg-list-item button{width:28px; height:28px; border-radius:6px; background:var(--card); border:1px solid var(--line-strong); color:var(--ink-dim); flex-shrink:0;}
.cfg-list-item button:hover{color:var(--red); border-color:var(--red);}
.cfg-params-row{display:flex; gap:8px; align-items:center; margin-bottom:6px;}
.cfg-params-row input[type="text"]{flex:1;}
.cfg-params-row label{display:flex; align-items:center; gap:4px; font-size:.72rem; color:var(--ink-dim); white-space:nowrap;}
.cfg-params-row button{width:26px; height:26px; border-radius:6px; background:var(--paper); border:1px solid var(--line-strong); color:var(--ink-faint); flex-shrink:0;}

/* ---------- toast ---------- */
.toast-container{position:fixed; bottom:24px; left:50%; transform:translateX(-50%); display:flex; flex-direction:column; gap:8px; z-index:1000; pointer-events:none;}
.toast{display:flex; align-items:center; gap:10px; padding:11px 18px; background:var(--ink); color:#fff; border-radius:8px; font-family:var(--mono); font-size:.78rem; box-shadow:0 8px 24px rgba(0,0,0,.25); animation:tin .3s ease forwards; pointer-events:auto;}
.toast.ok i{color:var(--teal);} .toast.err i{color:var(--red);}
.toast.out{animation:tout .3s ease forwards;}
@keyframes tin{from{opacity:0; transform:translateY(14px)} to{opacity:1; transform:translateY(0)}}
@keyframes tout{from{opacity:1} to{opacity:0; transform:translateY(14px)}}

/* ---------- mobile ---------- */
.sidebar-toggle{display:none;}
@media (max-width:980px){
  .split{grid-template-columns:1fr;}
  .console{position:relative; top:0;}
}
@media (max-width:760px){
  .layout{grid-template-columns:1fr;}
  .sidebar{
    display:none; position:fixed; top:57px; left:0; right:0; bottom:0; z-index:200; background:var(--paper);
    padding:16px 0 40px;
  }
  .sidebar.open{display:block;}
  .sidebar-toggle{display:flex; align-items:center; gap:6px; background:var(--card); border:1px solid var(--line-strong); padding:7px 12px; border-radius:7px; font-family:var(--mono); font-size:.78rem; font-weight:600;}
  .collapse-btn{display:none;}
  .topbar-search{display:none;}
  .main{padding:20px 16px 60px;}
  .page-title{font-size:1.4rem;}
}
</style>
</head>
<body>

<div class="toast-container" id="toastContainer"></div>

<!-- TOPBAR -->
<div class="topbar">
  <button class="sidebar-toggle" id="sidebarToggle"><i class="fas fa-bars"></i> Endpoints</button>
  <button class="collapse-btn" id="collapseBtn" title="Buka/tutup sidebar"><i class="fas fa-angles-left"></i></button>
  <div class="brand"><span class="dot"></span>HIKARU<small>&nbsp;rest api</small></div>
  <div class="topbar-search">
    <i class="fas fa-magnifying-glass"></i>
    <input type="text" id="endpointSearch" placeholder="Cari endpoint..." />
    <kbd>/</kbd>
  </div>
  <div class="topbar-links">
    <div class="status-chip"><span class="pd"></span> Semua sistem aktif</div>
  </div>
</div>

<div class="layout">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-group">
      <div class="node" id="configNode">
        <span class="node-method" style="background:var(--paper2); color:var(--ink-dim);"><i class="fas fa-gear"></i></span>
        <span class="node-name">Config</span>
      </div>
    </div>
    <div style="height:1px; background:var(--line); margin:8px 24px 8px 40px;"></div>
    <div id="sidebarTree"></div>
  </aside>

  <!-- MAIN -->
  <main class="main" id="mainContent"></main>

</div>



<script>
/* ============================================================
   KONFIGURASI DEFAULT — nilai awal. Setelah dijalankan, base URL
   dan daftar endpoint sepenuhnya bisa diatur lewat panel "Config"
   di sidebar (tersimpan otomatis di localStorage browser).
   ============================================================ */
const DEFAULT_API_BASE_URL = "https://www.poly-md.my.id";

const DEFAULT_ENDPOINTS = [
  {
    id: "ai-chat",
    category: "Artificial Intelligence",
    name: "AI Chat",
    method: "GET",
    path: "/response",
    description: "Kirim sebuah pesan dan terima balasan dari model AI Hikaru. Cocok untuk chatbot, auto-reply, atau asisten percakapan.",
    params: [
      { name: "message", required: true, placeholder: "halo, apa kabar?" },
      { name: "username", required: false, placeholder: "user" }
    ],
    render: "json"
  },
  {
    id: "tiktok-downloader",
    category: "Media Downloader",
    name: "TikTok Downloader",
    method: "GET",
    path: "/tiktok",
    description: "Ambil tautan unduhan video TikTok tanpa watermark beserta metadata (judul, kreator, thumbnail).",
    params: [
      { name: "url", required: true, placeholder: "https://vt.tiktok.com/ZSjXXXXX/" }
    ],
    render: "tiktok"
  }
];

/* ============================================================
   STORAGE — base URL & daftar endpoint dibaca dari localStorage
   kalau sudah pernah disimpan lewat panel Config.
   ============================================================ */
function loadBaseUrl(){
  return localStorage.getItem("hikaru_base_url") || DEFAULT_API_BASE_URL;
}
function loadEndpoints(){
  try{
    const raw = localStorage.getItem("hikaru_endpoints");
    if(raw){ const parsed = JSON.parse(raw); if(Array.isArray(parsed) && parsed.length) return parsed; }
  }catch(e){}
  return JSON.parse(JSON.stringify(DEFAULT_ENDPOINTS));
}
function persistBaseUrl(url){ API_BASE_URL = url; localStorage.setItem("hikaru_base_url", url); }
function persistEndpoints(){ localStorage.setItem("hikaru_endpoints", JSON.stringify(ENDPOINTS)); }

let API_BASE_URL = loadBaseUrl();
let ENDPOINTS = loadEndpoints();

/* ============================================================
   RENDER STATE
   ============================================================ */
let activeId = ENDPOINTS[0].id;
let editingEndpointId = null;

function groupByCategory(list){
  const map = new Map();
  list.forEach(ep => {
    if(!map.has(ep.category)) map.set(ep.category, []);
    map.get(ep.category).push(ep);
  });
  return map;
}

function renderSidebar(filter=""){
  const tree = document.getElementById("sidebarTree");
  const q = filter.trim().toLowerCase();
  const filtered = ENDPOINTS.filter(ep => !q || ep.name.toLowerCase().includes(q) || ep.path.toLowerCase().includes(q));
  const groups = groupByCategory(filtered);
  let html = "";
  groups.forEach((eps, cat) => {
    html += `<div class="sidebar-group"><div class="sidebar-group-label">${escHtml(cat)}</div>`;
    eps.forEach(ep => {
      html += `
        <div class="node ${ep.id===activeId?'active':''}" data-id="${ep.id}">
          <span class="node-method ${ep.method.toLowerCase()}">${ep.method}</span>
          <span class="node-name">${escHtml(ep.name)}</span>
          <span class="node-pulse"></span>
        </div>`;
    });
    html += `</div>`;
  });
  tree.innerHTML = html || `<div style="padding:20px 24px;color:var(--ink-faint);font-size:.82rem;">Tidak ditemukan.</div>`;
  tree.querySelectorAll(".node").forEach(n => {
    n.addEventListener("click", () => { activeId = n.dataset.id; location.hash = activeId; selectEndpoint(activeId); if(window.innerWidth<=760) closeSidebar(); });
  });
}

function selectEndpoint(id){
  const ep = ENDPOINTS.find(e => e.id === id);
  if(!ep) return;
  activeId = id;
  document.querySelectorAll(".node").forEach(n => n.classList.toggle("active", n.dataset.id===id));
  renderMain(ep);
}

function renderMain(ep){
  const fullUrl = `${API_BASE_URL}${ep.path}`;
  const paramRows = ep.params.map(p => `
    <tr>
      <td><code>${escHtml(p.name)}</code></td>
      <td>${p.required ? '<span class="param-req">WAJIB</span>' : '<span class="param-opt">opsional</span>'}</td>
      <td class="param-desc">${escHtml(p.placeholder || "")}</td>
    </tr>`).join("");

  const exampleQuery = ep.params.filter(p=>p.required).map(p=>`${p.name}=${encodeURIComponent(p.placeholder||"nilai")}`).join("&");
  const exampleUrl = `${fullUrl}${exampleQuery ? "?"+exampleQuery : ""}`;

  const curl = `curl -s "${exampleUrl}"`;
  const js = `fetch("${exampleUrl}")\n  .then(res => res.json())\n  .then(data => console.log(data))\n  .catch(err => console.error(err));`;
  const py = `import requests\n\nres = requests.get("${fullUrl}", params={\n${ep.params.map(p=>`    "${p.name}": "${p.placeholder||''}"`).join(",\n")}\n})\nprint(res.json())`;

  document.getElementById("mainContent").innerHTML = `
    <div class="crumb">Hikaru REST API <i class="fas fa-chevron-right" style="font-size:.6rem;margin:0 4px;"></i> <span>${escHtml(ep.category)}</span></div>
    <div class="title-row">
      <h1 class="page-title">${escHtml(ep.name)}</h1>
      <span class="tag-live"><span class="node-pulse" style="margin:0;"></span> Live</span>
    </div>
    <p class="page-desc">${escHtml(ep.description)}</p>

    <div class="split">
      <!-- DOCS -->
      <div class="docs">
        <div class="doc-block">
          <div class="doc-label">Parameter</div>
          <table class="param-table">
            <thead><tr><th>Nama</th><th>Wajib</th><th>Contoh</th></tr></thead>
            <tbody>${paramRows || '<tr><td colspan="3" class="param-desc">Tidak ada parameter.</td></tr>'}</tbody>
          </table>
        </div>

        <div class="doc-block">
          <div class="doc-label">Contoh kode</div>
          <div class="snippet-tabs">
            <div class="snippet-tab active" data-lang="curl">cURL</div>
            <div class="snippet-tab" data-lang="js">JavaScript</div>
            <div class="snippet-tab" data-lang="py">Python</div>
          </div>
          <div class="snippet-body">
            <button class="snippet-copy" id="snippetCopyBtn"><i class="fas fa-copy"></i> Copy</button>
            <div class="snippet-pane active" data-lang="curl"><pre>${highlightCurl(curl)}</pre></div>
            <div class="snippet-pane" data-lang="js"><pre>${highlightJs(js)}</pre></div>
            <div class="snippet-pane" data-lang="py"><pre>${highlightPy(py)}</pre></div>
          </div>
        </div>

        <div class="doc-block">
          <div class="doc-label">Endpoint</div>
          <table class="param-table">
            <tbody>
              <tr><td style="width:120px;">Method</td><td><code>${ep.method}</code></td><td></td></tr>
              <tr><td>Base URL</td><td colspan="2"><code>${escHtml(API_BASE_URL)}</code></td></tr>
              <tr><td>Path</td><td colspan="2"><code>${escHtml(ep.path)}</code></td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- CONSOLE -->
      <div class="console">
        <div class="console-head">
          <div class="dots"><span></span><span></span><span></span></div>
          <div class="console-head-title">Konsol Uji Coba</div>
          <svg class="trace" id="trace" viewBox="0 0 70 16"><path d="M0,8 L20,8 L24,2 L28,14 L32,8 L70,8"/></svg>
        </div>
        <div class="console-url">
          <span class="method-pill ${ep.method.toLowerCase()}">${ep.method}</span>
          <span id="consoleUrlText">${escHtml(API_BASE_URL + ep.path)}</span>
        </div>
        <div class="console-form" id="consoleForm">
          ${ep.params.map(p => `
            <div class="field">
              <label>${escHtml(p.name)} ${p.required ? '<span class="req">wajib</span>' : ''}</label>
              <input type="text" data-param="${escHtml(p.name)}" placeholder="${escHtml(p.placeholder||'')}" />
            </div>`).join("")}
          <button class="send-btn" id="sendBtn"><i class="fas fa-paper-plane"></i> Kirim Request</button>
        </div>
        <div class="console-response">
          <div class="resp-tabs">
            <div class="resp-tab active">Response</div>
            <div class="resp-status" id="respStatus" style="display:none;"></div>
          </div>
          <div class="resp-body" id="respBody">
            <div class="resp-placeholder"><i class="fas fa-satellite-dish"></i><p>Isi parameter lalu klik Kirim Request<br>untuk melihat response.</p></div>
          </div>
        </div>
      </div>
    </div>
  `;

  // snippet tabs
  document.querySelectorAll(".snippet-tab").forEach(t=>{
    t.addEventListener("click",()=>{
      document.querySelectorAll(".snippet-tab").forEach(x=>x.classList.remove("active"));
      document.querySelectorAll(".snippet-pane").forEach(x=>x.classList.remove("active"));
      t.classList.add("active");
      document.querySelector(`.snippet-pane[data-lang="${t.dataset.lang}"]`).classList.add("active");
    });
  });
  document.getElementById("snippetCopyBtn").addEventListener("click", function(){
    const active = document.querySelector(".snippet-pane.active pre").innerText;
    navigator.clipboard.writeText(active).then(()=>{ showToast("ok","Kode disalin"); });
  });

  // live console url preview
  const urlTextEl = document.getElementById("consoleUrlText");
  document.querySelectorAll('#consoleForm input').forEach(inp=>{
    inp.addEventListener("input", updatePreviewUrl);
  });
  function updatePreviewUrl(){
    const parts = [];
    document.querySelectorAll('#consoleForm input').forEach(i=>{
      if(i.value.trim()) parts.push(`${i.dataset.param}=${encodeURIComponent(i.value.trim())}`);
    });
    urlTextEl.textContent = API_BASE_URL + ep.path + (parts.length ? "?"+parts.join("&") : "");
  }

  document.getElementById("sendBtn").addEventListener("click", () => sendRequest(ep));
}

/* ============================================================
   CONFIG VIEW — atur base URL & kelola endpoint lewat UI,
   tersimpan otomatis di localStorage browser.
   ============================================================ */
function renderConfig(){
  editingEndpointId = null;
  document.getElementById("mainContent").innerHTML = `
    <div class="crumb">Hikaru REST API <i class="fas fa-chevron-right" style="font-size:.6rem;margin:0 4px;"></i> <span>Config</span></div>
    <div class="title-row"><h1 class="page-title">Config</h1></div>
    <p class="page-desc">Atur alamat server API dan kelola daftar endpoint langsung dari sini. Perubahan tersimpan otomatis di browser ini.</p>

    <div class="cfg-block">
      <h3>Base URL</h3>
      <div class="cfg-sub">Alamat root server API kamu. Semua path endpoint akan digabung ke alamat ini.</div>
      <div class="cfg-row">
        <div class="cfg-field" style="flex:2; min-width:260px;">
          <label>API Base URL</label>
          <input type="text" id="cfgBaseUrl" value="${escHtml(API_BASE_URL)}" placeholder="https://api.domainkamu.com" />
        </div>
        <button class="cfg-btn primary" id="cfgSaveBaseUrl"><i class="fas fa-check"></i> Simpan</button>
      </div>
    </div>

    <div class="cfg-block">
      <h3>Daftar Endpoint</h3>
      <div class="cfg-sub">${ENDPOINTS.length} endpoint terdaftar. Klik pensil untuk edit, tempat sampah untuk hapus.</div>
      <div class="cfg-list" id="cfgEndpointList"></div>
    </div>

    <div class="cfg-block">
      <h3 id="cfgFormTitle">Tambah Endpoint Baru</h3>
      <div class="cfg-sub">Isi detail endpoint. Endpoint akan langsung muncul di sidebar dan konsol uji-coba.</div>
      <div style="display:flex; flex-direction:column; gap:14px;">
        <div class="cfg-row">
          <div class="cfg-field"><label>Nama</label><input type="text" id="cfgName" placeholder="Nama Endpoint" /></div>
          <div class="cfg-field"><label>Kategori</label><input type="text" id="cfgCategory" placeholder="mis. AI, Media Downloader" /></div>
        </div>
        <div class="cfg-row">
          <div class="cfg-field" style="flex:0 0 110px;">
            <label>Method</label>
            <select id="cfgMethod"><option value="GET">GET</option><option value="POST">POST</option></select>
          </div>
          <div class="cfg-field"><label>Path</label><input type="text" id="cfgPath" placeholder="/endpoint-baru" /></div>
          <div class="cfg-field" style="flex:0 0 140px;">
            <label>Tampilan Respons</label>
            <select id="cfgRender"><option value="json">JSON mentah</option><option value="tiktok">Kartu TikTok</option></select>
          </div>
        </div>
        <div class="cfg-field">
          <label>Deskripsi</label>
          <textarea id="cfgDescription" placeholder="Jelaskan fungsi endpoint ini untuk dokumentasi..."></textarea>
        </div>
        <div class="cfg-field">
          <label>Parameter</label>
          <div id="cfgParamRows"></div>
          <button class="cfg-btn ghost" id="cfgAddParamRow" style="align-self:flex-start; margin-top:4px;"><i class="fas fa-plus"></i> Tambah Parameter</button>
        </div>
        <div class="cfg-row">
          <button class="cfg-btn primary" id="cfgSaveEndpoint"><i class="fas fa-floppy-disk"></i> Simpan Endpoint</button>
          <button class="cfg-btn ghost" id="cfgCancelEdit" style="display:none;">Batal Edit</button>
          <button class="cfg-btn danger" id="cfgResetAll" style="margin-left:auto;"><i class="fas fa-rotate-left"></i> Reset ke Default</button>
        </div>
      </div>
    </div>
  `;

  renderCfgEndpointList();
  document.getElementById("cfgParamRows").innerHTML = "";
  addCfgParamRow();

  document.getElementById("cfgSaveBaseUrl").addEventListener("click", () => {
    const val = document.getElementById("cfgBaseUrl").value.trim();
    if(!val){ showToast("err","Base URL tidak boleh kosong"); return; }
    persistBaseUrl(val);
    showToast("ok","Base URL disimpan");
    renderConfig();
  });

  document.getElementById("cfgAddParamRow").addEventListener("click", () => addCfgParamRow());
  document.getElementById("cfgSaveEndpoint").addEventListener("click", saveCfgEndpoint);
  document.getElementById("cfgCancelEdit").addEventListener("click", () => renderConfig());
  document.getElementById("cfgResetAll").addEventListener("click", () => {
    if(!confirm("Kembalikan base URL & semua endpoint ke pengaturan default? Perubahan kustom akan hilang.")) return;
    localStorage.removeItem("hikaru_base_url");
    localStorage.removeItem("hikaru_endpoints");
    API_BASE_URL = loadBaseUrl();
    ENDPOINTS = loadEndpoints();
    activeId = ENDPOINTS[0].id;
    showToast("ok","Dikembalikan ke default");
    renderSidebar();
    renderConfig();
  });
}

function renderCfgEndpointList(){
  const list = document.getElementById("cfgEndpointList");
  list.innerHTML = ENDPOINTS.map(ep => `
    <div class="cfg-list-item">
      <span class="node-method ${ep.method.toLowerCase()}">${ep.method}</span>
      <div>
        <div class="clabel">${escHtml(ep.name)}</div>
        <div class="cpath">${escHtml(API_BASE_URL + ep.path)}</div>
      </div>
      <button data-edit="${ep.id}" title="Edit"><i class="fas fa-pen"></i></button>
      <button data-del="${ep.id}" title="Hapus"><i class="fas fa-trash"></i></button>
    </div>`).join("");
  list.querySelectorAll("[data-edit]").forEach(b => b.addEventListener("click", () => loadCfgEndpointForEdit(b.dataset.edit)));
  list.querySelectorAll("[data-del]").forEach(b => b.addEventListener("click", () => deleteCfgEndpoint(b.dataset.del)));
}

function addCfgParamRow(name="", required=false, placeholder=""){
  const wrap = document.getElementById("cfgParamRows");
  const row = document.createElement("div");
  row.className = "cfg-params-row";
  row.innerHTML = `
    <input type="text" class="cfg-p-name" placeholder="nama parameter" value="${escHtml(name)}" />
    <label><input type="checkbox" class="cfg-p-req" ${required?"checked":""}/> wajib</label>
    <input type="text" class="cfg-p-ph" placeholder="contoh nilai" value="${escHtml(placeholder)}" />
    <button type="button" title="Hapus parameter"><i class="fas fa-xmark"></i></button>`;
  row.querySelector("button").addEventListener("click", () => row.remove());
  wrap.appendChild(row);
}

function loadCfgEndpointForEdit(id){
  const ep = ENDPOINTS.find(e => e.id === id);
  if(!ep) return;
  editingEndpointId = id;
  document.getElementById("cfgFormTitle").textContent = `Edit Endpoint — ${ep.name}`;
  document.getElementById("cfgName").value = ep.name;
  document.getElementById("cfgCategory").value = ep.category;
  document.getElementById("cfgMethod").value = ep.method;
  document.getElementById("cfgPath").value = ep.path;
  document.getElementById("cfgRender").value = ep.render || "json";
  document.getElementById("cfgDescription").value = ep.description;
  document.getElementById("cfgParamRows").innerHTML = "";
  (ep.params||[]).forEach(p => addCfgParamRow(p.name, p.required, p.placeholder));
  document.getElementById("cfgCancelEdit").style.display = "inline-flex";
  document.getElementById("cfgSaveEndpoint").scrollIntoView({behavior:"smooth", block:"center"});
}

function deleteCfgEndpoint(id){
  if(!confirm("Hapus endpoint ini?")) return;
  ENDPOINTS = ENDPOINTS.filter(e => e.id !== id);
  persistEndpoints();
  if(activeId === id && ENDPOINTS.length) activeId = ENDPOINTS[0].id;
  showToast("ok","Endpoint dihapus");
  renderSidebar();
  renderCfgEndpointList();
}

function saveCfgEndpoint(){
  const name = document.getElementById("cfgName").value.trim();
  const category = document.getElementById("cfgCategory").value.trim() || "Lainnya";
  const method = document.getElementById("cfgMethod").value;
  const path = document.getElementById("cfgPath").value.trim();
  const render = document.getElementById("cfgRender").value;
  const description = document.getElementById("cfgDescription").value.trim();

  if(!name || !path){ showToast("err","Nama dan path wajib diisi"); return; }

  const params = [];
  document.querySelectorAll("#cfgParamRows .cfg-params-row").forEach(row => {
    const pname = row.querySelector(".cfg-p-name").value.trim();
    if(!pname) return;
    params.push({
      name: pname,
      required: row.querySelector(".cfg-p-req").checked,
      placeholder: row.querySelector(".cfg-p-ph").value.trim()
    });
  });

  if(editingEndpointId){
    const idx = ENDPOINTS.findIndex(e => e.id === editingEndpointId);
    if(idx > -1) ENDPOINTS[idx] = { ...ENDPOINTS[idx], name, category, method, path: path.startsWith("/")?path:"/"+path, description, params, render };
    showToast("ok","Endpoint diperbarui");
  } else {
    const id = slugify(name) + "-" + Math.random().toString(36).slice(2,6);
    ENDPOINTS.push({ id, name, category, method, path: path.startsWith("/")?path:"/"+path, description, params, render });
    showToast("ok","Endpoint ditambahkan");
  }
  persistEndpoints();
  renderSidebar();
  renderConfig();
}

function slugify(str){
  return String(str).toLowerCase().trim().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"") || "endpoint";
}

/* ============================================================
   REQUEST HANDLING
   ============================================================ */
async function sendRequest(ep){
  const btn = document.getElementById("sendBtn");
  const respBody = document.getElementById("respBody");
  const respStatus = document.getElementById("respStatus");
  const trace = document.getElementById("trace");

  const query = new URLSearchParams();
  let missing = null;
  document.querySelectorAll('#consoleForm input').forEach(inp => {
    const val = inp.value.trim();
    if(val) query.set(inp.dataset.param, val);
    else if(inp.previousElementSibling === null){}
  });
  for(const p of ep.params){
    if(p.required && !query.get(p.name)){ missing = p.name; }
  }
  if(missing){
    showToast("err", `Parameter "${missing}" wajib diisi`);
    return;
  }

  const url = `${API_BASE_URL}${ep.path}?${query.toString()}`;
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Mengirim...';
  trace.classList.add("live");
  respStatus.style.display = "none";
  respBody.innerHTML = `<div class="resp-placeholder"><i class="fas fa-circle-notch fa-spin"></i><p>Menunggu response...</p></div>`;

  try {
    const res = await fetch(url);
    const data = await res.json();
    respStatus.style.display = "inline-block";
    respStatus.textContent = `HTTP ${res.status}`;
    respStatus.className = "resp-status " + (res.ok ? "ok" : "err");

    const renderer = RESPONSE_RENDERERS[ep.render] || RESPONSE_RENDERERS.json;
    respBody.innerHTML = renderer(data);
    showToast(res.ok ? "ok" : "err", res.ok ? "Response diterima" : "Server mengembalikan error");
  } catch(err){
    respStatus.style.display = "inline-block";
    respStatus.textContent = "ERROR";
    respStatus.className = "resp-status err";
    respBody.innerHTML = `<pre>${syntaxHighlightJson(JSON.stringify({error: err.message || "Request gagal"}, null, 2))}</pre>`;
    showToast("err", "Request gagal: " + err.message);
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-paper-plane"></i> Kirim Request';
    setTimeout(()=>trace.classList.remove("live"), 900);
  }
}

/* ============================================================
   RESPONSE RENDERERS — tambahkan renderer baru di sini bila perlu
   ============================================================ */
const RESPONSE_RENDERERS = {
  json(data){
    return `<pre>${syntaxHighlightJson(JSON.stringify(data, null, 2))}</pre>`;
  },
  tiktok(data){
    const result = data.result || data.data || data;
    const hasVideo = result && (result.video || result.videoUrl || result.play || result.hdplay || result.nowm);
    if(!hasVideo) return RESPONSE_RENDERERS.json(data);
    const title = result.title || result.desc || "Video TikTok";
    const author = result.author || result.nickname || "unknown";
    const thumb = result.cover || result.thumbnail || result.origin_cover || "";
    const links = [];
    const tryLink=(u,label)=>{ if(u && typeof u==="string" && u.startsWith("http")) links.push({u,label}); };
    tryLink(result.hdplay, "Unduh HD (No Watermark)");
    tryLink(result.nowm || result.play, "Unduh Video");
    tryLink(result.music, "Unduh Audio");
    return `
      <div class="tt-card">
        ${thumb ? `<img class="tt-thumb" src="${thumb}" onerror="this.style.display='none'">` : ""}
        <div class="tt-title">${escHtml(title)}</div>
        <div class="tt-author"><i class="fas fa-user"></i> @${escHtml(String(author))}</div>
        <div class="tt-links">
          ${links.map(l=>`<a class="tt-link" href="${l.u}" target="_blank" rel="noopener"><i class="fas fa-download"></i> ${l.label}</a>`).join("") || `<div style="color:#8FA3B0;font-size:.78rem;">Tidak ada tautan unduhan pada response ini.</div>`}
        </div>
      </div>`;
  }
};

/* ============================================================
   UTILITIES
   ============================================================ */
function escHtml(str){
  return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function syntaxHighlightJson(json){
  const esc = escHtml(json);
  return esc.replace(/(&quot;(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\&])*&quot;(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, m=>{
    let c="sn";
    if(/^&quot;/.test(m)) c = /:$/.test(m) ? "sk" : "ss";
    else if(/true|false/.test(m)) c = "sf";
    return `<span class="${c}">${m}</span>`;
  });
}
function highlightCurl(str){
  return escHtml(str).replace(/^(curl)/, '<span class="sf">$1</span>').replace(/(-s)/, '<span class="sk">$1</span>').replace(/(&quot;.*?&quot;)/, m=>`<span class="ss">${m}</span>`);
}
function highlightJs(str){
  let s = escHtml(str);
  s = s.replace(/\b(fetch|then|catch|console|log|error)\b/g, '<span class="sf">$1</span>');
  s = s.replace(/(&quot;.*?&quot;)/g, '<span class="ss">$1</span>');
  return s;
}
function highlightPy(str){
  let s = escHtml(str);
  s = s.replace(/\b(import|print)\b/g, '<span class="sk">$1</span>');
  s = s.replace(/\b(requests|get)\b/g, '<span class="sf">$1</span>');
  s = s.replace(/(&quot;.*?&quot;)/g, '<span class="ss">$1</span>');
  return s;
}
function showToast(type, msg){
  const c = document.getElementById("toastContainer");
  const t = document.createElement("div");
  t.className = `toast ${type}`;
  t.innerHTML = `<i class="fas ${type==='ok' ? 'fa-circle-check' : 'fa-triangle-exclamation'}"></i> ${escHtml(msg)}`;
  c.appendChild(t);
  setTimeout(()=>{ t.classList.add("out"); setTimeout(()=>t.remove(),300); }, 2800);
}
function openSidebar(){ document.getElementById("sidebar").classList.add("open"); }
function closeSidebar(){ document.getElementById("sidebar").classList.remove("open"); }

/* ============================================================
   INIT
   ============================================================ */
document.addEventListener("DOMContentLoaded", () => {
  const hashId = location.hash.replace("#","");
  if(hashId && ENDPOINTS.some(e=>e.id===hashId)) activeId = hashId;

  renderSidebar();
  selectEndpoint(activeId);

  document.getElementById("endpointSearch").addEventListener("input", e => renderSidebar(e.target.value));
  document.addEventListener("keydown", e => {
    if(e.key === "/" && document.activeElement.tagName !== "INPUT"){
      e.preventDefault();
      document.getElementById("endpointSearch")?.focus();
    }
  });

  document.getElementById("sidebarToggle").addEventListener("click", () => {
    document.getElementById("sidebar").classList.toggle("open");
  });

  document.getElementById("collapseBtn").addEventListener("click", toggleSidebarCollapse);
  if(localStorage.getItem("hikaru_sidebar_collapsed") === "1"){
    document.querySelector(".layout").classList.add("collapsed");
    document.getElementById("collapseBtn").classList.add("rotated");
  }

  document.getElementById("configNode").addEventListener("click", () => {
    activeId = "__config__";
    document.querySelectorAll(".node").forEach(n => n.classList.remove("active"));
    document.getElementById("configNode").classList.add("active");
    renderConfig();
    if(window.innerWidth<=760) closeSidebar();
  });
});

function toggleSidebarCollapse(){
  const layout = document.querySelector(".layout");
  const btn = document.getElementById("collapseBtn");
  const collapsed = layout.classList.toggle("collapsed");
  btn.classList.toggle("rotated", collapsed);
  localStorage.setItem("hikaru_sidebar_collapsed", collapsed ? "1" : "0");
}
